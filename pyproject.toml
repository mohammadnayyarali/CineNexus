[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cinenexus"
version = "0.1.0"
description = "Content-based Netflix title recommendation system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110,<1",
    "joblib>=1.4,<2",
    "pandas>=2.0,<3",
    "pydantic>=2.0,<3",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6.0,<7",
    "scikit-learn>=1.3,<2",
    "streamlit>=1.30,<2",
    "uvicorn[standard]>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "mypy>=1.8,<2",
    "pytest>=8,<9",
    "pytest-cov>=5,<6",
    "ruff>=0.5,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
